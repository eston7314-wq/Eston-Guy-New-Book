name: Bug report
description: An agent, script, or converter misbehaved
labels: ["bug"]
body:
  - type: input
    id: where
    attributes: { label: Agent or script }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: input
    id: tool
    attributes: { label: Tool and version (Claude Code, Codex, ...) }
