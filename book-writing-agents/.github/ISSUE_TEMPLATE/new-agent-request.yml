name: New agent request
description: Suggest a new agent for the Book Agency
labels: ["enhancement", "new-agent"]
body:
  - type: input
    id: name
    attributes: { label: Agent name, placeholder: e.g. Indexer }
    validations: { required: true }
  - type: dropdown
    id: division
    attributes:
      label: Division
      options: [orchestration, strategy, research, writing, editing, marketing, publishing, new division (describe below)]
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What would it do, and which stage gap does it fill? }
    validations: { required: true }
